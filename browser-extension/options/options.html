<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SentinelAI Options</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; max-width: 800px; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 12px; }
      label { display: block; margin: 12px 0 6px; font-weight: 600; }
      input, select { width: 100%; max-width: 420px; padding: 8px; }
      button { margin-top: 16px; padding: 10px 16px; }
    </style>
  </head>
  <body>
    <h2>SentinelAI Runtime</h2>
    <div class="card">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="monitor">Monitor</option>
        <option value="warn">Warn</option>
        <option value="block">Block</option>
      </select>

      <label for="threshold">Risk Threshold</label>
      <input id="threshold" type="number" min="0" max="1" step="0.1" value="0.7">

      <button id="save">Save Settings</button>
    </div>
    <script src="options.js"></script>
  </body>
</html>
